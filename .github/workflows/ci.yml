name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Syntax and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.6.9
      - name: Python lint (ruff)
        run: ruff check .
      - name: Python syntax
        run: python -m compileall -q build.py studio scripts tests
      - name: JavaScript syntax
        # The runner ships with Node; this only parses the file.
        run: |
          node --version
          node --check studio/static/app.js

  privacy:
    name: Privacy guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pypdf==6.21.1
      - name: No personal data in tracked files or the demo PDFs
        run: python scripts/check_privacy.py
        env:
          # Optional repository secret: comma separated names and employers that must never
          # be committed. Empty (and the check still runs) when unset or on fork PRs.
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -m "not typst"

  demo:
    # Windows, like the machine the resumes are built on: the templates prefer Calibri, so
    # page fill and line wrapping match what the editor shows.
    name: Demo build, one page, ATS text
    runs-on: windows-latest
    env:
      TYPST_VERSION: "0.15.1"
      REQUIRE_TYPST: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Install Typst
        shell: pwsh
        run: |
          $name = "typst-x86_64-pc-windows-msvc"
          Invoke-WebRequest "https://github.com/typst/typst/releases/download/v$env:TYPST_VERSION/$name.zip" -OutFile "$env:RUNNER_TEMP\typst.zip"
          Expand-Archive "$env:RUNNER_TEMP\typst.zip" -DestinationPath "$env:RUNNER_TEMP\typst"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\typst\$name"
          & "$env:RUNNER_TEMP\typst\$name\typst.exe" --version
      - name: Build the full demo pool
        run: python build.py --example build master
      - name: Every demo application fits one page
        run: python build.py --example check
      - name: ATS text extraction and fresh demo PDFs
        run: python -m pytest -m typst
